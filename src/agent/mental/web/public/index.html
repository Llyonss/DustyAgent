<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mental — 心智模型</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>

<!-- 移动端 Tab 栏（桌面隐藏） -->
<div class="mobile-tabs" id="mobileTabs">
  <div class="mobile-tab active" data-tab="chat" onclick="App.switchTab('chat')">💬 对话</div>
  <div class="mobile-tab" data-tab="mental" onclick="App.switchTab('mental')">🧠 心智</div>
</div>

<!-- 左栏：对话 45% -->
<div id="chatPanel">
  <div class="chat-header">
    <div class="header-left">
      <select id="instanceSelect"></select>
      <button class="btn-icon" onclick="App.newInstance()" title="新建实例">+</button>
      <button class="btn-icon" onclick="App.deleteInstance()" title="删除实例">−</button>
    </div>
    <div class="header-right">
      <button class="btn-text" onclick="Chat.toggleHistory()">📜 故事</button>
      <span id="runningIndicator" class="hidden">●</span>
    </div>
  </div>
  <div id="historyPanel" class="hidden"></div>
  <div id="chatMessages" class="chat-messages"></div>
  <div class="chat-input">
    <textarea id="chatInput" placeholder="发消息..." rows="1"></textarea>
    <button id="sendBtn" onclick="Chat.send()">发送</button>
    <button id="stopBtn" class="hidden" onclick="Chat.abort()">停止</button>
  </div>
</div>

<!-- 右栏：心智面板 55% -->
<div id="mentalPanel">
  <div class="mental-sidebar" id="mentalSidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">心智</span>
      <button class="btn-icon btn-small" onclick="Mental.showGraph()" title="图谱">◎</button>
    </div>
    <div id="mentalTree"></div>
    <div class="sidebar-self" onclick="Mental.select('self')">◆ self</div>
    <div id="storyTree"></div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="App.toggleSidebar()"></div>
  <div class="mental-main" id="mentalMain">
    <!-- 移动端工具条（桌面隐藏） -->
    <div class="mental-mobile-bar" id="mentalMobileBar">
      <button class="btn-icon btn-small" onclick="App.toggleSidebar()">☰</button>
      <span class="mental-mobile-title">心智图谱</span>
    </div>
    <div id="graphView">
      <svg id="graphSvg"></svg>
    </div>
    <div id="contentView" class="hidden">
      <div class="content-bar">
        <span id="contentName">选择一个心智</span>
        <div class="content-actions">
          <button class="btn-icon btn-small" onclick="Mental.showMentalStories()" title="相关故事">📜</button>
          <button class="btn-icon btn-small" onclick="Mental.edit('content')" title="编辑内容">✏️</button>
          <button class="btn-icon btn-small" onclick="Mental.edit('links')" title="编辑链接">🔗</button>
          <button class="btn-icon btn-small" onclick="Mental.showGraph()" title="返回图谱">◎</button>
        </div>
      </div>
      <div id="contentScroll">
        <div id="systemPromptSection" class="hidden">
          <div class="system-prompt-header" onclick="Mental.togglePanel('systemPromptBody')">
            <span class="system-prompt-label">▸ System Prompt</span>
            <button class="btn-icon btn-small" onclick="event.stopPropagation();Mental.edit('system')" title="编辑 System Prompt">✏️</button>
          </div>
          <div id="systemPromptBody" class="system-prompt-body collapsed"></div>
          <div id="systemEnvInfo" class="system-env-info"></div>
        </div>
        <div id="toolsSection" class="hidden">
          <div class="tools-header" onclick="Mental.togglePanel('toolsList')">
            <span class="tools-label">▸ Tools</span>
            <button class="btn-icon btn-small" onclick="event.stopPropagation();Mental.newTool()" title="新增工具">+</button>
          </div>
          <div id="toolsList" class="collapsed"></div>
        </div>
        <div id="messagePreview" class="hidden"></div>
        <div id="contentBody"><div class="empty">从目录或图谱选择心智</div></div>
        <div id="contentLinks"></div>
      </div>
      <div id="editArea" class="hidden">
        <textarea id="editTextarea"></textarea>
        <div class="edit-bar">
          <span id="editLabel"></span>
          <div><button class="btn" onclick="Mental.cancelEdit()">取消</button> <button class="btn btn-primary" onclick="Mental.saveEdit()">保存</button></div>
        </div>
      </div>
    </div>
    <div id="storyView" class="hidden">
      <div class="content-bar">
        <span id="storyTitle">故事</span>
        <div class="content-actions">
          <button class="btn-icon btn-small" onclick="Mental.showGraph()" title="返回图谱">◎</button>
        </div>
      </div>
      <div id="storyScroll">
        <div id="storyBody"></div>
        <div id="storyEvents"></div>
      </div>
    </div>
  </div>
</div>

<script src="app.js?v=2"></script>
<script src="chat.js?v=2"></script>
<script src="graph.js?v=2"></script>
<script src="tree.js?v=2"></script>
<script src="mental.js?v=2"></script>
<script>App.init();</script>
</body>
</html>
